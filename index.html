<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beatles Albums</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body class="w-100" onload="preencheCards()">
    <header class="w-100">
        <div id="logo">
            <img src="assets/img/Beatles logo.png" alt="">
        </div>
    </header>
    <main class="w-100">
        <div id="topo">
            <h4 class="m-0">Álbuns em Destaque</h4>
        </div>
        <div id="carrosselAlbuns" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carrosselAlbuns" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carrosselAlbuns" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carrosselAlbuns" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <div class="d-flex justify-content-center" style="background-color: rgb(61, 65, 55); height: 70vh;">
                        <img src="assets/img/revolver cover.jpg" class="d-block w-auto" alt="capa_revolver">
                    </div>
                    <div class="carousel-caption d-none d-md-block start-0 bottom-0 w-100" style="background-color: rgba(10, 18, 12, 0.6);">
                        <h5>Revolver (1966)</h5>
                        <p>Sétimo álbum de estúdio dos Beatles</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <div class="d-flex justify-content-center" style="background-color: rgb(61, 65, 55); height: 70vh;">
                        <img src="assets/img/abbey road cover.jpg" class="d-block w-auto" alt="capa_revolver">
                    </div>
                    <div class="carousel-caption d-none d-md-block start-0 bottom-0 w-100" style="background-color: rgba(10, 18, 12, 0.6);">
                        <h5>Abbey Road (1969)</h5>
                        <p>Penúltimo álbum de estúdio dos Beatles</p>
                    </div>
                </div>
                <div class="carousel-item">
                    <div class="d-flex justify-content-center" style="background-color: rgb(61, 65, 55); height: 70vh;">
                        <img src="assets/img/help cover.jpg" class="d-block w-auto" alt="capa_revolver">
                    </div>
                    <div class="carousel-caption d-none d-md-block start-0 bottom-0 w-100" style="background-color: rgba(10, 18, 12, 0.6);">
                        <h5>Help (1965)</h5>
                        <p>Quinto álbum de estúdio dos Beatles</p>
                    </div>
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carrosselAlbuns" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carrosselAlbuns" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
        <div id="tituloMeio">
            <h4>Todos os Itens (entidade principal)</h4>
        </div>
        <div class="row row-cols-1 row-cols-md-4 g-5 mx-2 my-1">
            <a href="detalhes.html?id=1">
                <div class="col">
                    <div class="card" id="card1">
                    </div>
                </div>
            </a>
            <div class="col">
                <div class="card" id="card2">
                </div>
            </div>
            <div class="col">
                <div class="card" id="card3">
                </div>
            </div>
            <div class="col">
                <div class="card" id="card4">
                </div>
            </div>
            <div class="col">
                <div class="card" id="card5">
                </div>
            </div>
            <div class="col">
                <div class="card" id="card6">
                </div>
            </div>
            <div class="col">
                <div class="card" id="card7">
                </div>
            </div>
            <div class="col">
                <div class="card" id="card8">
                </div>
            </div>
            <div class="col">
                <div class="card" id="card9">
                </div>
            </div>
            <div class="col">
                <div class="card" id="card10">
                </div>
            </div>
            <div class="col">
                <div class="card" id="card11">
                </div>
            </div>
            <div class="col">
                <div class="card" id="card12">
                </div>
            </div>
            <div class="col">
                <div class="card" id="card13">
                </div>
            </div>
            <div class="col-1 col-md-9 areaBanda">
                <div id="banda">
                    <div class="beatle">
                        <img src="assets/img/george.jpg" alt="">
                    </div>
                    <div class="beatle">
                        <img src="assets/img/paul.jpg" alt="">
                    </div>
                    <div class="beatle">
                        <img src="assets/img/ringo.jpg" alt="">
                    </div>
                    <div class="beatle">
                        <img src="assets/img/john.jpg" alt="">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <br>

    <footer>
        <h4>Informações do Aluno</h4>
        <div id="infoAluno">
            <div id="sobre">
                <h5>Sobre</h5>
            </div>
            <div id="autoria">
                <h5>Autoria</h5>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="assets/js/app.js"></script>
    <script>
        preencheCards = () => {
            for(let i = 0; i < dados.albuns.length; i++)
            {
                document.getElementById(`card${i+1}`). innerHTML = `
                    <a href="detalhes.html?id=${i+1}">
                        <img src="${dados.albuns[i].capa}" class="card-img-top" id="card-capa${i+1}" alt="...">
                        <div class="card-body">
                            <h5 class="card-title" id="card-titulo${i+1}">${dados.albuns[i].nome}</h5>
                            <p class="card-text" id="card-descricao${i+1}">${dados.albuns[i].descricao}</p>
                        </div>
                    </a>
                `
            }
        }
    </script>
</body>
</html>
